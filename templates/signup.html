<!DOCTYPE html>
<html>
  <head>
    <title>
      Sign Up - FAR RFO Study App
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-blue-900 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <h1 class="text-xl font-bold text-white">FAR RFO Study App</h1>
    </div>
    </nav>

  <!-- Centered Card -->
  <main class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white roudned-lg shadow-md p-6 sm:p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Create an Account</h2>
      {% if error %}
        <div class="mb-4 p-3 bg-red-50 border-l-4 border-red-600 rounded">
          <p class="text-red-800 text-sm">{{ error }}</p>
    </div>
      {% endif %}
      <form method="POST" action="/signup" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required autofocus class="w-full px-4 py-2 border border-gray-300 rounded focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required minlength="8" class="w-full px-4 py-2 border border-gray-300 rounded focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
          <p class="mt-1 text-xs text-gray-500">At least 8 characters</p>
        </div>
        <button type="submit" class="w-full px-6 py-2 bg-blue-900 text-white rounded hover:bg-blue-800 transition font-medium">Sign up</button>
        </form>
      <p class="mt-6 text-center text-sm text-gray-600">Already have an account? <a href="/login" class="text-blue-700 hover:text-blue-900 font-medium">Log in</a>
        </p>
      </div>
    </main>
  
</body>
</html>
