<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}FAR RFO Ready{% endblock %}</title>
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <script src="https://cdn.tailwindcss.com"></script>
     {% block extra_head %}{% endblock %}
      </head>
      <body class="bg-gray-50 min-h-screen flex flex-col">

        <nav class="bg-blue-900 text-white shadow-md">
          <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-white hover:opacity-90">RFO Ready</a>
            {% if session.get('user_id') %}

            <div class="text-sm flex items-center gap-4">
              <a href="/learn" class="hover:opacity-75">Study</a>
              <a href="/study" class="hover:opacity-75">Quiz</a>
              <a href="/stats" class="hover:opacity-75">Stats</a>
              <a href="/logout" class="underline hover:opacity-75">Log out</a>
              </div>
            {% else %}
            <div class="text-sm flex items-center gap-4">
              <a href="/login" class="hover:opacity-75">Log in</a>
              <a href="/signup" class="px-3 py-1.5 bg-white text-blue-900 rounded font-medium hover:bg-gray-100">Sign up</a>
              </div>
            {% endif %}
          </div>
        </nav>


        <main class="flex-1">
          {% block content %}{% endblock %}
        </main>

        {% block footer %}{% endblock %}
      </body>
       </html>
