<!DOCTYPE html>
<html>
  <head>
    <title>
      Log In - FAR RFO Study App
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-blue-900 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <h1 class="text-xl font-bold text-white">FAR RFO Study App</h1>
    </div>
  </nav>
 <main class="max-w-md mx-auto px-4 py-12">
   <div class="bg-white rounded-lg shadow-md p-6 sm:p-8">
     <h2 class="text-2xl font-bold text-gray-900 mb-6">Log In</h2>
     {% if error %}
       <div class="mb-4 p-3 bg-red-50 border-l-4 border-red-600 rounded">
         <p class="text-red-800 text-sm">{{ error }}</p>
         </div>
     {% endif %}
     <form method="POST" action="/login" class="space-y-4">
       <div>
         <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
         <input type="email" name="email" required autofocus class="w-full px-4 py-2 border border-gray-300 rounded focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
         </div>
       <div>
         <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
         <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
         </div>
       <button type="submit" class="w-full px-6 py-2 bg-blue-900 text-white rounded hover:bg-blue-800 transition font-medium">Log In</button>
       </form>
     <p class="mt-6 text-center text-sm text-gray-600">Don't have an account? <a href="/signup" class="text-blue-700 hover:text-blue-900 font-medium">Sign up</a>
       </p>
     </div>
 </main>
</body>
</html>
